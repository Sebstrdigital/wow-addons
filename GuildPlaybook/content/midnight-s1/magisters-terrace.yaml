# Guild Playbook content — Magisters' Terrace (Midnight Season 1)
# Source: guild PDF playbooks (Tank/Healer/DPS, Draft 0.9, patch 12.0.7)
# Edit this file, then run tools/generate.py to regenerate the Lua data.

dungeon: "Magisters' Terrace"
slug: magisters-terrace
season: midnight-s1
patch: "12.0.7"
sourceVersion: "0.9"
instanceID: 585   # TBC-era map ID — confirm in-game with /gp ids

overview:
  interrupts:
    - { spell: "Terror Wave", note: "must stop" }
    - { spell: "Pyroblast", note: "must stop" }
    - { spell: "Polymorph", note: "high priority" }
    - { spell: "Shadow Bolt / Arcane Bolt", note: "use spare interrupts" }
  killPriority:
    - "Lightward Healer"
    - "Blazing Pyromancer"
    - "Void Infuser"
    - "Shadowrift Voidcaller"
  tank:
    damage:
      - "Arcane Blade — purge the Enforcer or use a defensive."
      - "Devouring Strike — major tank hit plus a large healing absorb."
      - "Void Gash — Voidlings add Shadow damage to their melee attacks."
      - "Ethereal Shackles — request a Magic dispel or use a root break."
    pullWarnings:
      - "Do not combine too many Animated Codices; their constant Arcane Volley damage stacks."
      - "Do not combine multiple dangerous casters without an interrupt plan."
      - "Stagger Brightscale Wyrm and Unstable Voidling deaths."
      - "Pick up adds immediately when a Shadowrift Voidcaller uses Call of the Void."
      - "Face every Runed Spellbreaker away from the group."
  healer:
    dispels:
      - "Ethereal Shackles — remove the root and damage."
      - "Holy Fire — remove from the targeted player."
      - "Polymorph — dispel if the interrupt is missed."
      - "Consuming Void — dispel before pressure overlaps."
    pressure:
      - "Arcane Volley — constant group damage from Animated Codices."
      - "Ignition — heavy group damage from Blazing Pyromancers."
      - "Runic Glaive — focused damage on two players."
      - "Consuming Shadows — heavy group damage; line-of-sight can avoid it."
      - "Devouring Strike / Void Bomb — large healing absorbs."
    pullWarnings:
      - "Ask the tank to limit Animated Codices and overlapping casters."
      - "Save a cooldown when Ignition, Arcane Volley or Consuming Shadows overlap."
      - "Watch the tank closely against Devouring Tyrants."
      - "Stagger Wyrm and Unstable Voidling deaths to reduce burst damage."
  dps:
    purges:
      - "Arcane Blade — purge from Sunblade Enforcers."
      - "Power Word: Shield — purge from enemy targets."
      - "Hastening Ward — purge from Seranel immediately."
      - "Stagger Brightscale Wyrm and Unstable Voidling deaths."
    defensives:
      - "Use a defensive for Ignition, Runic Glaive or Consuming Shadows."
      - "Use a defensive when targeted by Runic Mark or a long Devouring Entropy."
      - "Do not combine missed casts with avoidable ground damage."
  tip: "Collect the library's 5% Haste tome; it lasts 30 minutes and persists through death."

bosses:
  - name: "Arcanotron Custos"
    encounterID: null   # fill via /gp ids
    npcID: null       # boss npc ID (wowhead URL number) — enables the 3D model side-cart
    displayID: null   # preferred over npcID: model display ID, renders without cache
    wipe:
      - "An Energy Orb reaching the boss damages the group and empowers it."
      - "Poor puddle placement can leave the group without safe space."
    roles:
      TANK:
        job:
          - "Start near an outside edge."
          - "Move the boss away from Arcane Residue."
          - "Preserve clean floor space for the orb phase."
          - "Help soak Energy Orbs, but do not take too many stacks."
          - "Keep the boss away from any orbs that remain unsoaked."
        avoid:
          - "Do not stand with a puddle behind you before a knockback."
          - "Move out of Arcane Residue immediately."
          - "Use the room's terrain to control your knockback."
        defensive:
          - "Use active mitigation or a defensive for Repulsing Slam."
          - "Use another defensive if Ethereal Shackles overlaps with group damage."
          - "Consider a defensive when soaking multiple Energy Orbs."
        reminder: "Edge puddles → defensive for Slam → stop the orbs."
      HEALER:
        job:
          - "Dispel Ethereal Shackles quickly."
          - "Top the group before Arcane Expulsion."
          - "Watch players soaking Energy Orbs for Unstable Energy stacks."
        avoid:
          - "Stay clear of Arcane Residue and keep a safe knockback path."
          - "Do not soak several Energy Orbs back-to-back without a defensive."
        cooldowns:
          - "Use a healing cooldown if Shackles overlaps Arcane Expulsion."
          - "Prepare extra healing during Refueling Protocol orb soaks."
        reminder: "Dispel Shackles → top before Expulsion → watch orb stacks."
      DPS:
        job:
          - "Soak Energy Orbs before they reach the boss."
          - "Do not take too many Unstable Energy stacks."
          - "Use damage cooldowns during Refueling Protocol; the boss takes extra damage."
        avoid:
          - "Drop puddles around the outside and move out of Arcane Residue."
          - "Keep clear space behind you before knockbacks."
        defensive:
          - "Use a personal if Shackles overlaps Arcane Expulsion."
          - "Use a defensive when soaking multiple orbs."
        reminder: "Edge puddles → soak Orbs → burn during Refueling."

  - name: "Seranel Sunlash"
    encounterID: null
    npcID: null       # boss npc ID (wowhead URL number) — enables the 3D model side-cart
    displayID: null   # preferred over npcID: model display ID, renders without cache
    wipe:
      - "Standing outside the Suppression Zone when the silence cast finishes causes heavy damage and an eight-second pacify."
      - "Clearing two Runic Marks together can stack group damage."
    roles:
      TANK:
        job:
          - "Keep the Suppression Zone accessible near the centre."
          - "Do not drag the boss or zone into an awkward corner."
          - "Purge Hastening Ward immediately when possible."
          - "Enter the Suppression Zone just before Vow/Wave of Silence finishes."
          - "If marked, clear Runic Mark without overlapping another player."
        avoid:
          - "Give marked players room to clear separately."
          - "Avoid the arcane impacts created when a mark is removed."
          - "Do not remain inside the Suppression Zone longer than necessary."
        defensive:
          - "Use a major defensive if Hastening Ward is not purged."
          - "Use a defensive when clearing Runic Mark, especially if you clear second."
        reminder: "Centre the zone → purge Ward → enter for Silence."
      HEALER:
        job:
          - "Spot-heal players targeted by Runic Mark."
          - "Stagger mark removals so group damage does not stack."
          - "Enter the Suppression Zone before Vow of Silence finishes."
        avoid:
          - "Do not overlap with another marked player."
          - "Move away from the arcane impacts produced when a mark is removed."
        cooldowns:
          - "Use externals or focused healing on the second mark target."
          - "Prepare a cooldown if Hastening Ward is not purged."
        reminder: "Heal marks → stagger removals → enter the zone for Silence."
      DPS:
        job:
          - "Purge Hastening Ward immediately."
          - "Clear Runic Mark inside the Suppression Zone, separately from the other target."
          - "Enter the zone before Vow of Silence finishes."
        avoid:
          - "Spread from other marked players."
          - "Dodge the arcane impacts produced when marks are removed."
        defensive:
          - "Use a personal when clearing Runic Mark, especially if clearing second."
        reminder: "Purge Ward → clear marks separately → enter for Silence."

  - name: "Gemellus"
    encounterID: null
    npcID: null       # boss npc ID (wowhead URL number) — enables the 3D model side-cart
    displayID: null   # preferred over npcID: model display ID, renders without cache
    wipe:
      - "Reaching a copy during Astral Grasp causes extreme damage."
      - "Failing Neural Link leaves the boss protected and prolongs the encounter."
    roles:
      TANK:
        job:
          - "Position yourself so the group can cleave multiple copies."
          - "Remember that every copy shares health."
          - "At 50%, expect another Triplicate."
          - "If targeted by Neural Link, touch the indicated copy."
          - "Run away from your assigned copy during Astral Grasp."
        avoid:
          - "Drop Cosmic Sting puddles away from the fighting area."
          - "Stay outside the circle around each copy during Astral Grasp."
          - "Do not let the pull drag you into Cosmic Radiation."
        defensive:
          - "Use a defensive if movement tools are unavailable during Astral Grasp."
          - "Use a defensive if Cosmic Sting overlaps with another mechanic."
        reminder: "Cleave copies → touch your linked copy → run from the pull."
      HEALER:
        job:
          - "Watch Cosmic Sting targets and its damage-over-time effect."
          - "Keep escape lanes clear when Void Secretions create puddles."
          - "Help players struggling against Astral Grasp."
        avoid:
          - "Run away from your assigned copy during Astral Grasp."
          - "Stay out of Cosmic Radiation around each copy."
        cooldowns:
          - "Use spot healing on low-mobility players during Astral Grasp."
          - "Use a defensive if Cosmic Sting overlaps the pull."
        reminder: "Heal Sting → keep escape lanes clear → run from the pull."
      DPS:
        job:
          - "Cleave all copies because they share health."
          - "Touch the indicated copy to resolve Neural Link."
          - "Run away from your assigned copy during Astral Grasp."
        avoid:
          - "Drop Cosmic Sting puddles away from the fighting area."
          - "Stay outside Cosmic Radiation around every copy."
        defensive:
          - "Use a personal if Cosmic Sting overlaps Astral Grasp."
        reminder: "Cleave copies → resolve your link → run from Grasp."

  - name: "Degentrius"
    encounterID: null
    npcID: null       # boss npc ID (wowhead URL number) — enables the 3D model side-cart
    displayID: null   # preferred over npcID: model display ID, renders without cache
    wipe:
      - "Missing an Unstable Void Essence impact damages the whole group; repeated misses can wipe the party."
      - "Null Bomb must be triggered before it expires."
      - "Clipping another player with Hulking Fragment can kill them."
    roles:
      TANK:
        job:
          - "Face Hulking Fragment away from the group."
          - "After the hit, move away from melee before the healer dispels you."
          - "Drop the resulting Stygian Ichor puddle away from the group."
          - "Help cover one section of the room for Unstable Void Essence."
          - "Stay on the correct side of each Void Torrent beam."
          - "Continue using mitigation against Entropy Blast while away from the boss."
        avoid:
          - "Never cross a Void Torrent beam; it damages and stuns."
          - "Avoid Entropy Orbs released when Devouring Entropy ends."
          - "Keep your frontal and dispel puddle away from other players."
        defensive:
          - "Mitigate Hulking Fragment."
          - "Use a defensive if assigned a long Devouring Entropy."
          - "Use a defensive if soaking while another damage effect is active."
        reminder: "Frontal away → leave melee for dispel → catch the bouncing orb."
      HEALER:
        job:
          - "Dispel the tank's Umbral Splinters only after they leave melee."
          - "Heal Devouring Entropy targets and watch for soak overlaps."
          - "Help cover an assigned Unstable Void Essence impact."
        avoid:
          - "Never cross a Void Torrent beam."
          - "Avoid Entropy Orbs released when Devouring Entropy ends."
        cooldowns:
          - "Plan major healing for Devouring Entropy plus Essence soaks."
          - "Use an external if the tank must hold Hulking Fragment damage during an overlap."
        reminder: "Move tank out → dispel Splinters → heal Entropy and soaks."
      DPS:
        job:
          - "Spread across both sides and cover assigned Unstable Void Essence impacts."
          - "Trigger Null Bomb before it expires."
          - "Keep clear of the tank's Hulking Fragment frontal."
        avoid:
          - "Never cross a Void Torrent beam."
          - "Avoid Entropy Orbs released by Devouring Entropy."
        defensive:
          - "Use a personal for a long Devouring Entropy or a soak overlap."
        reminder: "Cover your section → avoid beams and Orbs → trigger Null Bomb."
