# Guild Playbook content — Altar of Fangs (Midnight Season 2)
# Source: guild PDF playbooks (Tank/Healer/DPS, Version 0.5 Pre-Season PTR Draft, patch 12.1)
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Note: the source PDFs mark trash casts, NPC names and route order as
# "live verification required" (PTR pre-season). Priority trash calls for
# High Evolutionist (Evolve — must interrupt), Ravenous Descendant
# (attack-speed stacks) and Caustic Mist Totem (Destroy) recur between
# every boss but have no dedicated trash section in this schema; the parts
# that map onto overview fields are captured below (interrupts / tank
# damage / tank pull warning). The rest (Ascendant Serpent / Ritual
# Chieftain / Altar ascent pack — all explicitly "live verification
# required") could not be transcribed into this structure.

dungeon: "Altar of Fangs"
slug: altar-of-fangs
season: midnight-s2
patch: "12.1.0"
sourceVersion: "0.5"
instanceID: null   # capture with /gp ids

overview:
  interrupts:
    - { spell: "Evolve", note: "High Evolutionist — interrupt first" }
    - { spell: "Toxic Atrophy", note: "The Writhing Coil — interrupt first" }
  killPriority:
