# Guild Playbook content — Voidscar Arena (Midnight Season 2)
# Source: guild DOCX playbooks "Voidscar Arena - {Tank,Healer,DPS} Playbook and
#         Cheat Sheet" (Draft 0.10, Patch 12.1 PTR, five-source review verified
#         9 August 2026).
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping: the v0.10 documents assert exactly one gameplay change since
# the prior review (27 July): Atroxus — Noxious Breath cast time 3 sec → 4 sec.
# That change is applied to Atroxus's sheet, roles and wipe list below. Every
# other boss's "Quick Reminder" prose reads differently in the new documents
# (e.g. Taz'Rah, Charonus), but no gameplay change is asserted for them and the
# same mechanics are still described — that reads as template reformatting, not
# a tactical change, so their existing wording is preserved rather than rewritten.
#
# quicksheet.trash gains a ROUTE entry, transcribed verbatim from the documents'
# "Route:" line. Caveat: that route opens with a player CHOICE point ("Opening
# miniboss choice"), and ROUTE is a flat string that cannot represent a branch —
# both miniboss options are folded into one linear step here; see trashSegments'
# "Opening trash" segment for the branch detail. The TANK/HEALER/DPS trash
# one-liners are otherwise unchanged: the new documents' "Top Priority Calls"
# reorders which ability leads each role's card, but Thundering Storm is still
# called out in the same documents' trash-section prose, so this reads as a
# template change rather than a dropped mechanic.
#
# REMOVED: none. Checked every quicksheet/overview/boss field against the new
# documents field-by-field; nothing present before is absent now. The only
# wording drops are inside the three Atroxus sheet.reminder one-liners, and
# they are required by the Noxious Breath propagation itself: "keep the arena
# clean" (TANK), "heal Claw" (HEALER) and "kite cleanly" (DPS) no longer fit in
# the terse reminder once it leads with "4-sec Breath dodge", but the same
# content survives in full in roles.{TANK,HEALER,DPS}.job/avoid/cooldowns for
# that boss — moved, not lost.
#
# Also without a home: each document opens with a one-line "Role Mission"
# statement that doesn't fit overview.tip or any other field (it's role
# philosophy, not a Voidscar-specific tactical tip):
#   Tank: "Control facing, steady the route and create safe space for every
#          mechanic."
#   Healer: "Prepare for predictable group damage, dispel when confirmed and
#            preserve movement space."
#   DPS: "Delete priority targets, respect movement mechanics and trade boss
#         uptime for safety."
#
# trashSegments is new this pass: the documents' "Opening Trash", "Relevant
# Trash — Taz'Rah to Atroxus" and "Relevant Trash — Atroxus to Charonus"
# sections map onto three segments. Unlike Ruby Life Pools, these sections read
# identically across all three role documents for this dungeon, so the per-role
# bullets below combine that shared body text with the role-specific "Top
# Priority Calls" one-liners from each document's page-1 cheat sheet.
# npcID/displayID are sourced from Mythic Dungeon Tools' published dungeon data
# (all NPCs have matches). "Domanaar lieutenants" is named only as a category in
# the documents (no specific NPC), so it appears as a role-bullet note rather
# than an npcs[] entry.
#
# Still without a home in the schema: Enemy Forces values, miniboss buff
# values, the opening-miniboss melee/caster choice mechanic, lieutenant casts
# and crowd-control interactions — all explicitly flagged "requires live
# verification" in the source documents and folded into overview.tip instead
# of modelled as fields.

dungeon: "Voidscar Arena"
slug: voidscar-arena
season: midnight-s2
patch: "12.1.0"
sourceVersion: "0.10"
instanceID: null   # capture with /gp ids

mdtRoutes:
  - name: "elitzur - keystone.guru (Aug 2026, 100.8% forces)"
    string: "!~MDT2~"

# All-roles quick sheet (from the Tank/Healer/DPS PDFs' page-1 cheat sheets)
quicksheet:
  trash:
    TANK: "Raj'kess the Spellstorm — [Thundering Storm]: Hold the pack steady; leave room for targeted strikes.; Watchful Harrower — Live Verification: Use a conservative pull size; this is a high-health true-sight miniboss.; Devouring Brutalizer — [Devour]: Protect and help free the target before the cast completes.; Brutal Overseer — [Brutal Slam]: Mitigate the tank hit and DoT."
    HEALER: "Raj'kess the Spellstorm — [Thundering Storm]: Prepare spot healing for targeted strikes.; Watchful Harrower — Live Verification: Expect a long, high-pressure miniboss pull.; Devouring Brutalizer — [Devour]: Keep the target stable while the group breaks it free.; Brutal Overseer — [Brutal Slam]: Prepare focused tank healing for the hit and DoT."
    DPS: "Raj'kess the Spellstorm — [Orb of Disruption]: Kill immediately before [Disrupting Blast].; Watchful Harrower — Live Verification: Commit priority damage to shorten the pull.; Devouring Brutalizer — [Devour]: Swap immediately and free the target.; Brutal Overseer — [Brutal Slam]: Use a personal if other damage overlaps."
    ROUTE: "Opening miniboss choice → Taz'Rah → Watchful Harrower section → Atroxus → Domanaar lieutenants → Charonus."

overview:
  interrupts:
    - { spell: "Orb of Disruption", note: "kill the orb before [Disrupting Blast]" }
  killPriority:
    - "[Orb of Disruption]"
    - "Toxic Creeper"
    - "Any target trapped by [Devour]"
  tank:
    damage:
      - "Taz'Rah — [Cosmic Spike]"
      - "Atroxus — [Hulking Claw]"
      - "Brutal Overseer — [Brutal Slam]"
    pullWarnings:
      - "Do not combine Watchful Harrower with nearby packs until release tuning is confirmed."
  healer:
    dispels:
      - "Atroxus poison interactions changed on PTR; confirm the release behaviour."
    pressure:
      - "[Nether Dash] DoTs"
      - "[Hulking Claw]"
      - "[Sickening Roar]"
      - "[Cosmic Blast]"
    pullWarnings:
      - "Enter Watchful Harrower with mana and a healing cooldown available."
  dps:
    defensives:
      - "Use personals for [Sickening Roar], [Cosmic Blast] and dangerous overlaps."
    pullWarnings:
      - "Raj'kess the Spellstorm — [Thundering Storm]: Avoid targeted lightning strikes."
      - "Agitated Voidscythe — [Corrosive Essence]: Separate from other targeted players."
      - "Watchful Harrower — Live Verification: Commit priority damage to shorten the pull."
      - "Position: Avoid adding nearby packs; the miniboss has true sight."
      - "Devouring Brutalizer — [Devour]: Swap immediately and free the target."
      - "Brutal Overseer — [Brutal Slam]: Use a personal if other damage overlaps."
  tip:
    - "Tank: Preserve movement for gravity pulls and knockbacks."
    - "Healer: Enter Watchful Harrower with mana and a cooldown ready."
    - "DPS: Priority mechanics are worth more than boss uptime."
    - "Version 0.10, five-source review verified 9 August 2026. One gameplay change found since 27 July: Atroxus — [Noxious Breath] cast time increased 3 sec → 4 sec."
    - "Version note: current live game remains Midnight Season 1 / Patch 12.0.7 as of 9 Aug; this guide targets Season 2 / Patch 12.1 PTR."
    - "Requires live verification: final 12.1 trash placements, Enemy Forces values, miniboss buffs, lieutenant casts, crowd-control interactions and post-PTR tuning."

