# Guild Playbook content — King's Rest (Midnight Season 2)
# Source: guild DOCX playbooks "King's Rest - {Tank,Healer,DPS} Playbook and
#         Cheat Sheet" (v0.6, Patch 12.1 PTR, verified 9 August 2026).
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping: the documents' four named trash sections ("Opening Trash",
# "Relevant Trash — The Golden Serpent to Mchimba", "Relevant Trash — Mchimba
# to The Council of Tribes", "Final Trash — The Council to Dazar") map 1:1
# onto trashSegments. Unlike Ruby Life Pools, King's Rest's trash-call text is
# byte-identical across the Tank/Healer/DPS documents for every segment, so
# trashSegments[].roles.TANK/HEALER/DPS carry the same lines rather than
# role-specific phrasing — that mirrors quicksheet.trash, whose
# "PRIORITY TRASH CALLS — IN DUNGEON ORDER" four-call subset is also identical
# across roles in the source.
#
# trashSegments[].npcs carries the mob names the documents call out, so the
# sidecar can show a model once IDs exist. Every npcID/displayID here is null:
# nothing in this repo sources trash NPC IDs, and a wrong displayID renders the
# wrong creature in-game, so they are left empty rather than guessed.
#
# Verified changes in v0.6 (the documents' own "VERIFIED UPDATE" line):
# Wretched Discharge (Mchimba's Half-Finished Mummy add) is now a 5-second
# cast, still mandatory to interrupt; Whirling Axes (The Council of Tribes)
# periodic damage is 11% lower but still worth avoiding/healing; Shadow of
# Zul's Dark Revelation now precedes Pool of Darkness in the final trash pack.
#
# No route order is stated in the documents — the "PRIORITY TRASH CALLS — IN
# DUNGEON ORDER" is a priority-of-calls list, not a movement path — so
# quicksheet.trash.ROUTE is still not added for this dungeon.
#
# Removed vs. the v0.5 content this file previously carried: Mchimba the
# Embalmer's tank job bullet "Keep clear paths to every coffin" is gone from
# every v0.6 document (quick sheet and full playbook, all three roles); it is
# replaced with "Hold Mchimba near centre," a different positioning call
# repeated consistently across all three documents, so this reads as a real
# strategy change rather than a doc oversight.
#
# Retained despite being absent from the v0.6 documents, because they read as
# doc omissions rather than dropped content (the surrounding Mchimba/Council
# mechanics they describe are still very much present, just not re-named in
# the shorter v0.6 prose): Mchimba's "Drain Fluids" target (healer job +ability
# defensive bullets) and the Council of Tribes' "Kula's bleed" / "Aka'ali's
# tank spike" (healer job, still says "Zanazal's totems" which the v0.6 docs
# do corroborate). Flag for confirmation rather than silently keep or drop.
#
# Still without a home in the schema: the previous-review date (27 Jul 2026),
# the "Sources cross-checked" list (Blizzard PTR dungeon testing 7 Jul-3 Aug,
# Wowhead Midnight S2 overview/PTR data, Icy Veins Patch 12.1 overview,
# Warcraft Wiki) and the "before Version 1.0" milestone note. These are folded
# into overview.tip rather than modelled as fields.

