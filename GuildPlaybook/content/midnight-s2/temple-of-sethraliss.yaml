# Guild Playbook content — Temple of Sethraliss (Midnight Season 2)
# Source: guild DOCX playbooks "Temple of Sethraliss - {Tank,Healer,Ranged
#         DPS} Playbook and Cheat Sheet" — "Midnight Season 2 • Patch 12.1
#         Live • Verified 12 September 2026 • Standard 1.7" (footer: "Live
#         hotfixes verified through 11 September 2026").
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Version note: this pass supersedes the prior Standard 1.6 / Patch 12.1 PTR
# pass (reviewed 9 August 2026). sourceVersion bumped "1.6" -> "1.7". The
# officer's DPS doc is now explicitly scoped "Ranged DPS"; no melee-specific
# guidance exists in either doc set — content still feeds the shared DPS role
# generically (see "Held for officer" below).
#
# Confirmed deltas applied to overview/roles/wipe/quicksheet this pass:
# - Corrupted Guardian's tank-damage ability reverts to "Tainted Strike" (all
#   three NEW docs use it consistently, retiring the prior pass's "Vile
#   Charge" rename); new numbers: caps at two applications, lasts 25 seconds.
#   "Vile Charge" was used only in this dungeon's YAML, so no other file needs
#   updating once abilities.yaml is merged.
# - Avatar of Sethraliss: exit 20 yards before the Corrupted Guardian dies
#   (Tank); Corrupted Lifeforce soaker periodic damage increased 33% (Healer);
#   Cleansed Lifeforce caps at three stacks and ticks every three seconds
#   (shared wipe); the Defiling Taint debuff is now visible on her frame
#   (Healer). The 300%-stacking Corruption Burst number is not restated in
#   the NEW docs and is kept per the REMOVED-only policy.
# - overview.interrupts rebuilt to the NEW docs' six-NPC Priority Interrupts
#   table order (adds Faithless Subjugator — Addle Mind, Brood Tender — Venom
#   Bolt, Temple Disruptor — Essence Disruption; renames Imbued Stormcaller's
#   entry from the uncorroborated "Shock" to "Lightning Bolt"). Charged Dust
#   Devil — Healing Surge and Agitated Nimbus — Accumulate Charge are kept at
#   the bottom of the list (dropped from the NEW table, not confirmed gone);
#   Agitated Nimbus's overview.dps.purges guidance is reworded to the NEW
#   docs' purge-only framing, "Purge before the group hit."
# - Trash roster grows across all four segments: Opening gains Sandswept
#   Hunter — Sandburst Arrow and Sandfury Stonefist — Sunder Slam, and Barbed
#   Krolusk — Serrated Charge moves here from the next segment (its role text
#   there now reads "Swarming Krolusk" only); the Adderis/Aspix–Merektha
#   segment gains Sand-Sworn Rider — Scouring Sand, Poisonous Viper —
#   Cytotoxin, Lightning Serpent — Serpent's Stormcall and Faithless
#   Subjugator — Addle Mind; the Merektha–Galvazzt segment gains Imbued
#   Stormcaller — Imbued Conduction / Lightning Bolt; the Eyes-gauntlet
#   segment gains Orb Watcher — Venomous Slash / Caustic Stomp and Twisted
#   Hexxer — Flame Shock / Latent Hex. Ground Pound gains the NEW docs'
#   "brace for damage and knockback" (knockback is new) alongside the prior
#   pass's "face away and dodge the frontal; damage reduced 5% on PTR" — kept
#   per the REMOVED-only policy, since the NEW docs don't restate it but
#   don't say it's gone either.
# - Adderis and Aspix: Tank gets the same Storm Blessed swap-target awareness
#   DPS already had, plus an Aspix — Frenzy faster-cast note; Healer
#   spot-heals Aspix — Gust targets.
# - Merektha: Tank now gathers Burrow adds under the boss (direct
#   contradiction of the prior "away from her marked path" — applied as an
#   update); Merektha — Lightning Bite added as a tank-damage source; Healer
#   poison-dispels Toxic Viper — Poison Spit; a living Toxic Viper or Storm
#   Serpent extending Burrow is added to the shared wipe list.
# - Galvazzt: Tank's job becomes active positioning ("move Galvazzt to keep
#   three Lightning Spire lanes short and clear"), replacing the static
#   "start near the edge" wording.
#
# REMOVED from the prior YAML by this pass: none. Content the NEW docs simply
# omit — Dutiful Tamer, the standalone "Swarming Krolusk — Serrated Charge"
# framing (folded into the moved Barbed Krolusk line, Swarming Krolusk itself
# kept), the Eye of Sethraliss / Siphon Energy gauntlet content, "each stack
# is 8%" / "the clear bug was fixed" on Agitated Nimbus, the 300% Corruption
# Burst cap, the 4-second/4.5-second Tempest Winds numbers, Galvazzt's
# 60%-stronger Consume Charge and channel length, and the 33-minute dungeon
# timer — is RETAINED per the REMOVED-only policy: the officer's cheat sheets
# are a curated top-line subset, not an exhaustive roster, so silent omission
# is not treated as confirmation the content is gone.
#
# Held for officer (not applied, see PR/report notes for detail):
# - Whether "Poisonous Viper — Cytotoxin" (trash, this pass) and "Toxic Viper
#   — Poison Spit" (Merektha's own card) are the same mob under two names,
#   and likewise "Lightning Serpent — Serpent's Stormcall" (trash) vs. "Storm
#   Serpent — Storm Catalyst" (Merektha's own card, unchanged). Trash lines
#   below use the NEW docs' trash-section names as given; Merektha's boss
#   block is untouched.
# - Whether Dutiful Tamer is confirmed removed live or just condensed out of
#   the officer's trash cards.
# - Whether the Eye of Sethraliss / Siphon Energy carrier mechanic still
#   exists live alongside Orb Watcher, or has been fully replaced by it — the
#   Eyes-gauntlet content below is therefore unioned (both kept), not merged.
# - Whether "Tainted Strike" is the correct live tooltip name for Corrupted
#   Guardian's tank-damage ability (see above) or a doc regression.
# - The Ranged DPS doc's Avatar avoid line ("exit 20 yards before the
#   Corrupted Guardian dies") and defensive line ("take one Corrupted
#   Lifeforce; never double-soak casually") were both added to roles.DPS on
#   officer follow-up.
#
# Still without a home in the schema: the dungeon timer/route note (folded
# into overview.tip / quicksheet.trash.ROUTE, now with no NEW-doc replacement
# value — the 33-minute PTR figure is kept per the REMOVED-only policy). The
# Healer document's Mistweaver Way of the Crane class note is spec-specific
# and does not fit overview.healer.pressure (a damage-source list, not a
# class caveat), so it is recorded here instead, carried over unchanged from
# the prior pass: "Class note: Mistweaver Way of the Crane is fixed on PTR;
# similar spells still require live verification." The live-verification
# hedge narrows in the NEW docs to a single line: "Faithless Tormentor
# execute threshold and per-Tormentor healing value remain inconsistent
# across current guides; follow the live tooltip." — replacing the prior
# pass's separate hedges on Eyes-gauntlet cast names and Shadowlash's
# threshold specifically (Shadowlash is a Faithless Tormentor ability, so the
# new hedge already covers it).

