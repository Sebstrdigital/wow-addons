# Guild Playbook content — The Blinding Vale (Midnight Season 2)
# Source: guild DOCX playbooks "The Blinding Vale - {Tank,Healer,DPS} Playbook and
#         Cheat Sheet" (v0.10, Patch 12.1 PTR, review and verified 9 August 2026).
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping: the documents' four named trash sections (Opening Trash,
# Bridge Trash, Lower Vale Trash, Final Approach) now map 1:1 onto trashSegments;
# they previously had no home in the schema. quicksheet.trash still carries the
# cheat sheets' page-1 PRIORITY TRASH CALLS — the at-a-glance subset, not the
# same content. The v0.10 documents' PTR verification hedges are kept verbatim
# on purpose; do not clean them out until the guides are re-verified on live.
#
# trashSegments[].npcs carries the mob names the documents call out. IDs are
# sourced from Mythic Dungeon Tools' published dungeon data (all NPCs have
# matches). Unlike some other dungeons' documents, all three role documents give
# identical, non-role-specific call text for each trash pack, so the
# TANK/HEALER/DPS lists within a segment are transcribed identically on purpose —
# that mirrors the source, it is not an authoring shortcut.
#
# Still without a home in the schema: the 31-minute dungeon timer (reduced from
# 33 minutes in the 28 July PTR update) and the cross-boss tuning notes (Trinity
# and Ruia boss health both 10% lower; Trinity's Thornblade bleed now runs 12
# sec) are folded into overview.tip rather than modelled as fields, following
# the same pattern Ruby Life Pools uses for its dungeon-wide notes. The
# "VERIFIED SOURCES" list and the "review 9 August 2026" line are likewise
# summarised in overview.tip rather than given a dedicated field.
#
# REMOVED (v0.9 -> v0.10): Lightwarden Ruia's TANK/HEALER/DPS avoid lines each
# dropped the "Lightfall" ability mention (bosses.Lightwarden Ruia.roles.{TANK,
# HEALER,DPS}.avoid), plus TANK's "repeated Pulverizing Strikes hits" phrase,
# HEALER's "tank-facing cones" phrase, and DPS's "Pulverizing Strikes cones"
# phrase. All three v0.10 role documents independently replace their avoid line
# with the identical sentence "Leave Lightfire before it forms; non-creators
# inside are hit immediately on creation." — that cross-document agreement is
# why this is treated as a deliberate rewrite rather than a doc oversight.
# Pulverizing Strikes mitigation is still covered under TANK's defensive field,
# so tanks keep guidance on that ability; HEALER and DPS no longer have any
# avoid-list reminder about the cone mechanic at all. "Lightfall" itself no
# longer appears anywhere in the v0.10 documents for this boss — unclear
# whether it was renamed into "Lightfire", retuned, or removed; flagged for
# live verification.

dungeon: "The Blinding Vale"
slug: the-blinding-vale
season: midnight-s2
patch: "12.1.0"
sourceVersion: "0.10"
instanceID: null   # capture with /gp ids

# All-roles quick sheet (from the Tank/Healer/DPS PDFs' page-1 cheat sheets)
quicksheet:
  trash:
    TANK: "INTERRUPT: Radiant Spellsower — Frantic Blooming; Lightwarden Ruia — Warden's Wrath.; MITIGATE: Luminous Thornmaw — Grievous Gash; Virid Grovekeeper — Earthrupture Strike.; POSITION: Luminous Thornmaw — Solar Breath; Sporeblight Belcher — Lightwarden's Blight."
    HEALER: "HEAL: Sporeblight Belcher — Spouting Floret; Potatoad Matriarch — Toxic Spew.; TOP TO FULL: Luminous Thornmaw — Grievous Gash; Lightwarden Ruia — Grievous Thrash.; MOVE: Virid Grovekeeper — Uproot; Overgrown Hydra — Lightmaw Beams.; LIVE CHECK: Bloodthorn Roots dispel type and final tuning."
    DPS: "INTERRUPT: Radiant Spellsower — Frantic Blooming; Lightwarden Ruia — Warden's Wrath.; STOP DAMAGE: Spineshield Beetle — Spiny Shield reflects attacks.; KILL FIRST: Pollinating Lashers, roots, Potadpole eggs and boss shields.; MOVE: Thorny Saptor — Hunting Leap; Overgrown Hydra — Lightmaw Beams."
    ROUTE: "Current PTR left path; final placement requires live verification."

overview:
  interrupts:
    - { spell: "Frantic Blooming", note: "Radiant Spellsower — must stop" }
    - { spell: "Warden's Wrath", note: "Lightwarden Ruia — must stop" }
  killPriority:
    - "Pollinating Lashers"
    - "Blocking roots"
    - "Potadpole eggs"
    - "Ziekket's shield"
  tank:
    damage:
      - "Luminous Thornmaw — Grievous Gash"
      - "Trinity — Bedrock Slam"
      - "Ziekket — Thornspike"
    pullWarnings:
      - "Do not combine Pollination, Spiny Shield and heavy caster pressure without stops."
      - "Mitigate: Luminous Thornmaw — Grievous Gash; Virid Grovekeeper — Earthrupture Strike."
      - "Position: Luminous Thornmaw — Solar Breath; Sporeblight Belcher — Lightwarden's Blight."
  healer:
    dispels:
      - "Bloodthorn Roots dispel type and final tuning need live confirmation."
    pressure:
      - "Heal first: Spouting Floret, Bedrock Surge, Lightcrazed Frenzy, Grievous Thrash and Oozing Xylem."
      - "Sporeblight Belcher — Spouting Floret; Potatoad Matriarch — Toxic Spew."
      - "Top to full: Luminous Thornmaw — Grievous Gash; Lightwarden Ruia — Grievous Thrash."
    pullWarnings:
      - "Toxic Spew plus Spouting Floret can create a dangerous party-damage overlap."
      - "Move for Virid Grovekeeper — Uproot and Overgrown Hydra — Lightmaw Beams."
  dps:
    purges:
      - "Spineshield Beetle — Spiny Shield reflects attacks; stop attacking into the reflect and break the absorb."
      - "Kill first: Pollinating Lashers, roots, Potadpole eggs and boss shields."
    pullWarnings:
      - "Stop attacking into Spineshield Beetle — Spiny Shield."
      - "Move: Thorny Saptor — Hunting Leap; Overgrown Hydra — Lightmaw Beams."
    defensives:
      - "Save personals for scheduled party damage; do not spend them after the hit."
  tip:
    - "Tank: Use the current left-path PTR route; keep death pools and frontals away from the party."
    - "Healer: Pre-position for beam mechanics so movement does not interrupt recovery healing."
    - "DPS: Save personals for scheduled party damage; do not spend them after the hit."
    - "Timer: 31 minutes, reduced from 33 minutes in the 28 July PTR update."
    - "Tuning: Lightblossom Trinity and Lightwarden Ruia boss health are both 10% lower; Trinity's Thornblade bleed now lasts 12 sec."
    - "Version 0.10, review and verified 9 August 2026 against Blizzard PTR updates and release schedule, Wowhead, Icy Veins, Warcraft Wiki and the current PTR community guide."
    - "Requires live verification after Patch 12.1: final tuning, pack placement and Bloodthorn Roots dispel type."

