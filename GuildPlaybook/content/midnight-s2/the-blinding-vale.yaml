# Guild Playbook content — The Blinding Vale (Midnight Season 2)
# Source: guild DOCX playbooks "The Blinding Vale - {Tank,Healer,Ranged DPS} Playbook and
#         Cheat Sheet" (v0.11, Patch 12.1.0, "Reviewed and verified 12 September 2026").
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# v0.11 note: the DPS source doc is now titled "Ranged DPS" (retitled from the
# v0.10 generic "DPS" doc). The addon schema has no melee/ranged split
# (TANK/HEALER/DPS only), so the DPS role below carries that doc's guidance
# as authored. Open question for the officer: whether a melee-specific doc is
# needed, or ranged-only lines should be flagged/generalised — not resolved
# this pass, see report.
#
# Content mapping: the documents' four named trash sections (Opening Trash,
# Bridge Trash, Lower Vale Trash, Final Approach) map 1:1 onto trashSegments;
# quicksheet.trash still carries the cheat sheets' page-1 PRIORITY TRASH CALLS
# — the at-a-glance subset, not the same content. Unlike some other dungeons'
# documents, all three role documents give identical, non-role-specific call
# text for each trash pack, so the TANK/HEALER/DPS lists within a segment are
# transcribed identically on purpose — that mirrors the source, it is not an
# authoring shortcut.
#
# Still without a home in the schema: the 31-minute dungeon timer and the
# cross-boss tuning notes are folded into overview.tip rather than modelled as
# fields, following the same pattern Ruby Life Pools uses for its dungeon-wide
# notes.
#
# RESOLVED (v0.10 -> v0.11): the v0.10 note below (kept for history) flagged
# Lightwarden Ruia's "Lightfall" as possibly renamed into "Lightfire", retuned,
# or removed after v0.10 dropped it from all three avoid lists. The v0.11 live
# docs restore "Lightfall" as a distinct, currently-live avoid-list ability
# alongside "Lightfire" in both the Tank and Healer docs, and also restore
# "Pulverizing Strikes" to the Tank and DPS avoid lists (v0.10 had trimmed it
# to the Tank defensive field only). Both are reapplied below.
#
# OPEN (v0.10 -> v0.11, held — see officer report): the new docs describe one
# merged "Opening path and first boss wing" trash pull (Radiant Spellsower,
# Lightgorged Lasher, Underbrush Stalker, Virid Grovekeeper, Sporeblight
# Belcher) rather than this file's four separate trashSegments. Only Lightgorged
# Lasher's move into the Opening segment was applied this pass (explicit
# instruction); confirming the rest of the merge (in particular whether
# Underbrush Stalker also moved) would need a fresh MDT route check.
#
# REMOVED (v0.9 -> v0.10, kept for history): Lightwarden Ruia's TANK/HEALER/DPS
# avoid lines each dropped the "Lightfall" ability mention (bosses.Lightwarden
# Ruia.roles.{TANK,HEALER,DPS}.avoid), plus TANK's "repeated Pulverizing
# Strikes hits" phrase, HEALER's "tank-facing cones" phrase, and DPS's
# "Pulverizing Strikes cones" phrase. All three v0.10 role documents
# independently replaced their avoid line with the identical sentence "Leave
# Lightfire before it forms; non-creators inside are hit immediately on
# creation." Pulverizing Strikes mitigation stayed under TANK's defensive
# field throughout. See the RESOLVED note above — v0.11 restores both.

