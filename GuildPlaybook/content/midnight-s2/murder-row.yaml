# Guild Playbook content — Murder Row (Midnight Season 2)
# Source: guild DOCX playbooks "Murder Row - {Tank,Healer,DPS} Playbook and
#         Cheat Sheet" — Midnight Season 2, Patch 12.1, Standard 1.7,
#         reviewed 12 September 2026. Status: live-patch data (the PTR
#         pre-launch status from v1.0 no longer applies). Sources: Blizzard
#         hotfixes and Season 2 overview; Wowhead; Method; Icy Veins.
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping unchanged from v1.0: the documents' "Trash before Kystia
# Manaheart" / "Cantina and trash before Zaen" / "Trash before Xathuux" /
# "Trash before Lithiel" sections map 1:1 onto trashSegments, in the same
# order as before. The Standard 1.7 documents give identical trash-call
# wording across all three role playbooks for every named pack (same as
# v1.0), so trashSegments roles still carry that shared wording for
# TANK/HEALER/DPS rather than an invented role split.
#
# Updated for Standard 1.7 (12 Sep 2026), against the v1.0 draft (9 Aug
# 2026, Patch 12.1 PTR):
# - Trash roster expanded from 4 named packs to ~13 across all four
#   segments (Felonious Mage, Seductive Sayaad, Felwyrm, Massive Felwyrm,
#   Influential Reviewer, Keen Taskmaster, Unleashed Imp, Shivan Punisher,
#   Wrathguard Flayer, Fel Invoker, Felmaster Lucsei's Eye Beam, Defiled
#   Golem's Fel Beam, on top of the previously-tracked Bribed Captain/Guard,
#   Warehouse Worker, Corrupted Warlock, Defiled Golem). Bribed Guard is
#   absent from the new documents but kept per orchestrator ruling — its
#   absence isn't proof of removal.
# - overview.interrupts replaced with the documents' own "Priority
#   interrupts" table (Fel Missiles, Seduction, Felfire Burst, Fel Rage,
#   Health Funnel, Chaos Bolt). Curse of Doom/Dark Pact/Blade Dance/Felstorm
#   dropped from that specific table, but their trash-call lines remain
#   elsewhere in the file (not deleted, just no longer "priority").
# - Lithiel Cinderfury — Fingers of the Legion renamed to [Fingers of
#   Gul'dan] by an explicit Blizzard change note in the source documents:
#   "Blizzard changed Lithiel Cinderfury — Fingers of Gul'dan to prefer
#   non-tanks, target 4 players and summon 4 Wild Imps." Applied everywhere
#   this dungeon references the old name; see abilities.yaml for the
#   pending rename (not applied there — shared file, another worker merges).
# - Xathuux the Annihilator gains a new tracked ability, [Infernal Crush]
#   (healing/avoid/mitigation added; treated as additive, not a rename of
#   Burning Steps/Demonic Rage — the documents use all three names in the
#   same sentences).
# - Lithiel's tank job now actively kites the "unkillable Summoned
#   Infernal" instead of just avoiding its aura; DPS no longer tries to
#   kill it.
# - Nibbles' 20% threshold, Kystia's [Felshield], and the 15-sec
#   [Destabilized] window are NOT in the new documents at all, but are also
#   not contradicted — kept per orchestrator ruling, with the new
#   documents' "until friendly" wording added alongside.
#
# Held for officer / live verification — NOT applied, see report:
# - [Corroding Spittle]'s caster is a 3-way conflict across the new
#   documents themselves (Kystia Manaheart per this file's existing text,
#   Nibbles per the new Healer boss card, Massive Felwyrm per the new trash
#   section — and abilities.yaml already separately lists caster: "Massive
#   Felwyrm"). Existing attribution left untouched.
# - "Street Sneak — Heartstop Poison" appears only in the Tank doc (and its
#   duplicate), nowhere in Healer/DPS; every other mention of Heartstop
#   Poison in all three documents (including that same Tank document's own
#   Boss 2 card) attributes it to Zaen Bladesorrow. Not added as a trash NPC.
# - "A pre-Xathuux warlock pack was removed" (dungeon overview fact, added
#   to the Zaen→Xathuux trashSegments entry below) directly conflicts with
#   the same documents' "Trash before Xathuux" section, which still lists
#   "Corrupted Warlock — Curse of Doom." Corrupted Warlock's existing
#   placement in the Xathuux→Lithiel segment was left untouched rather than
#   moved.
# - Kystia's burst-phase terminology: the Healer document's own Defensive
#   line names a "Chaotic Burst" window alongside Destabilized, which
#   matches the documents' own flagged unknown (see overview.tip below).
#   Not resolved into the YAML.
#
# No quicksheet.trash.ROUTE: unchanged from v1.0 — still no line in any
# document that gives a stated route.
#
# trashSegments[].npcs IDs are sourced from Mythic Dungeon Tools' published
# Midnight dungeon data where the creature name matches exactly. Seductive
# Sayaad and Influential Reviewer could not be matched with confidence
# (Seductive Sayaad has two same-named MDT entries with different IDs;
# Influential Reviewer only matches MDT's "Influentual Reviewer", a likely
# Blizzard typo, not an exact name) — both left null/null.
#
# Corrected against the 0.9 draft this file was previously transcribed from
# (still applies, unaffected by the Standard 1.7 update):
# - Destabilized (Kystia Manaheart) is 15 sec, not 20 — the v1.0 documents'
#   own CHANGE note called this out explicitly. Fixed in
#   overview.healer.pressure and the boss healer role.
# - Kystia's tank job was reversed in the draft: the tank holds Kystia
#   steady while the *group* drains Nibbles to 20%; the tank does not push
#   Nibbles down. Fixed.
# - Lithiel's roles.*.avoid lists all carried "Use the gateway." as
#   something to avoid. The documents are explicit that using the gateway
#   is required (Malefic Wave), so this was moved into each role's job list.
#
# Still without a home in the schema: the page-1 FOCUS-equivalent bullets
# are role-specific dungeon-wide guidance not tied to one boss or trash
# pack — folded into overview.tip per role rather than modelled as fields.
# The dungeon-wide facts new in Standard 1.7 (Row Snitches, Faceted
# Crystalline Fel trade, the post-Kystia disguise/cantina jobs, Five Star
# Review's 10%/5-min value, and the 655 Enemy Forces requirement) are also
# folded into overview.tip for the same reason.

dungeon: "Murder Row"
slug: murder-row
season: midnight-s2
patch: "12.1.0"
sourceVersion: "Standard 1.7"
instanceID: null   # capture with /gp ids

mdtRoutes:
  - name: "Tactyks PUG Friendly - Method/wago.io (Aug 2026)"
    string: "!~MDT2~"

# All-roles quick sheet (from the Tank/Healer/DPS DOCX cheat sheets' page-1
# cards). TANK/HEALER/DPS are the RUN-WIDE PRIORITIES kick/kill list, each
# lightly flavoured with that role's page-1 FOCUS bullet where the document
# actually gives role-specific detail. No ROUTE key — the documents state
# none; the dungeon order lives in trashSegments[].after instead.
#
# Not rewritten for Standard 1.7: the four packs called out here (Felmaster
# Lucsei, Corrupted Warlock x2, Defiled Golem) are still valid highest-
# priority calls and none are contradicted by the new documents. The trash
# roster below (trashSegments) grew substantially; this "priority calls"
# subset intentionally stays small rather than listing all ~13 named mobs.
quicksheet:
  trash:
    TANK: "Felmaster Lucsei — [Blade Dance]: Priority stop or move clear; never stack avoidable damage into it.; Corrupted Warlock — [Curse of Doom]: Highest interrupt priority; avoid combining with Defiled Golem danger without a planned stop.; Corrupted Warlock — [Dark Pact]: Interrupt or purge the defensive if it lands.; Defiled Golem — [Defiled Slam]: Leave the impact and use mitigation if targeted."
    HEALER: "Felmaster Lucsei — [Blade Dance]: Priority stop or move clear; never stack avoidable damage into it.; Corrupted Warlock — [Curse of Doom]: Plan around it — it is the group's highest interrupt priority.; Corrupted Warlock — [Dark Pact]: Interrupt or purge the defensive if it lands.; Defiled Golem — [Defiled Slam]: Leave the impact and use mitigation if targeted."
    DPS: "Felmaster Lucsei — [Blade Dance]: Priority stop or move clear; never stack avoidable damage into it.; Corrupted Warlock — [Curse of Doom]: Assigned interrupt priority — stop it before [Dark Pact].; Corrupted Warlock — [Dark Pact]: Interrupt or purge the defensive if it lands.; Defiled Golem — [Defiled Slam]: Leave the impact and use mitigation if targeted."

overview:
  interrupts:
    - { spell: "Fel Missiles", note: "Felonious Mage (opening trash) — interruptible group damage; interrupt the channel." }
    - { spell: "Seduction", note: "Seductive Sayaad (opening trash) — dangerous crowd control; interrupt or hard stop." }
    - { spell: "Felfire Burst", note: "Unleashed Imp (Xathuux trash) — random player damage; interrupt random-target damage." }
    - { spell: "Fel Rage", note: "Wrathguard Flayer (Xathuux trash) — interrupt or soothe buff." }
    - { spell: "Health Funnel", note: "Fel Invoker (Xathuux trash) — heals an enemy; interrupt the heal." }
    - { spell: "Chaos Bolt", note: "Lithiel Cinderfury — heavy random-target damage; maintain an interrupt rotation." }
  killPriority:
    - "Corrupted Warlock and Defiled Golem — kill first among trash."
    - "Nibbles — bring to 20% until friendly, without wasting burst on Kystia's [Felshield], then swap to Mirror Images."
    - "Mirror Images — both [Felstorm] casts must be stopped before bursting Kystia in [Destabilized]."
    - "Lithiel's Furious Vilefiend and Wild Imps — hard swap and cleave; prioritise empowered demons before [Malefic Wave]."
  tank:
    damage:
      - "[Chaos Barrage] (Kystia Manaheart) — active mitigation; keep nearby players clear of the jump where positioning allows."
      - "[Envenom] (Zaen Bladesorrow) — mitigate the tank hit and call for [Heartstop Poison] removal."
      - "[Legion Strike] (Xathuux the Annihilator) — active mitigation; keep the frontal away from allies."
      - "[Infernal Crush] (Xathuux the Annihilator) — keep it away from allies; mitigate the overlap with [Demonic Rage]."
      - "Vilefiend pressure (Lithiel Cinderfury) — cover Vilefiend and stacked add pressure."
      - "Felmaster Lucsei — [Blade Dance] (trash): priority stop or move clear; never stack avoidable damage into it."
      - "Defiled Golem — [Defiled Slam] (trash): leave the impact and use mitigation if targeted."
    pullWarnings:
      - "Avoid combining Corrupted Warlock and Defiled Golem danger without a planned stop."
      - "Corrupted Warlock — [Curse of Doom]: highest interrupt priority; kick before [Dark Pact]. Hold the pack still for the live split-damage visual."
      - "Corrupted Warlock — [Dark Pact]: interrupt or purge the defensive if it lands; keep control of the pack while the shield is down."
      - "Bribed Captain — [Deep Corruption]: kill first; it buffs nearby enemies. Bribed Guard's cast priority still needs live verification."
      - "Warehouse Worker — [Sharp Nail]: random-target bleed. Warehouse Worker — [Workplace Accident]: dodge the ground danger; workers no longer flee at 30%."
  healer:
    dispels:
      - "[Heartstop Poison] (Zaen Bladesorrow) — remove quickly when supported; otherwise use a personal and focused healing."
      - "[Corroding Spittle] (Kystia Manaheart) — remove the stacking Magic effect when available and stabilise the target."
      - "Corrupted Warlock — [Dark Pact] (trash): interrupt or purge the defensive if it lands; call the shield if your spec cannot purge."
      - "Corrupted Warlock — [Curse of Doom] (trash): prepare for split damage; follow the live stack visual."
    pressure:
      - "[Destabilized] (Kystia Manaheart) — sustain heavy party damage for the 15-sec window while the group bursts Kystia."
      - "[Killing Spree] (Zaen Bladesorrow) — top the group before the sequence and use a cooldown if players are uneven."
      - "[Infernal Crush] and [Demonic Rage] (Xathuux the Annihilator) — use a planned group cooldown and personals; prepare major healing for the overlap."
      - "Post-gateway Fire damage (Lithiel Cinderfury) — take the gateway immediately while maintaining healing range; heal lingering Fire damage after."
      - "Felmaster Lucsei — [Blade Dance] (trash): priority stop or move clear; never stack avoidable damage into it. Pre-heal the group hit and damage-over-time effect if the stop is missed."
      - "Defiled Golem — [Defiled Slam] (trash): prepare a direct tank heal."
    pullWarnings:
      - "Prepare a response for Felmaster Lucsei — [Blade Dance]."
      - "Bribed Captain — [Deep Corruption]: kill first; it buffs nearby enemies. Bribed Guard's cast priority still needs live verification."
      - "Warehouse Worker — [Sharp Nail]: random-target bleed. Warehouse Worker — [Workplace Accident]: dodge the ground danger; workers no longer flee at 30%."
  dps:
    purges:
      - "Corrupted Warlock — [Dark Pact]: purge or break the shield; live-verify its dispel type."
    defensives:
      - "Felmaster Lucsei — [Blade Dance]: priority stop or move clear; never stack avoidable damage into it. Prioritise Lucsei and use a personal defensive if caught."
      - "Corrupted Warlock — [Curse of Doom]: highest interrupt priority; follow the live split visual and do not guess the stack count if the kick is missed."
      - "Defiled Golem — [Defiled Slam]: leave the impact and use mitigation if targeted; stop it if the live build allows, otherwise use a defensive."
      - "[Heartstop Poison] (Zaen Bladesorrow): use a personal if targeted and allow the healer to remove it."
      - "[Demonic Rage] (Xathuux the Annihilator): use a personal and keep dealing damage if safe."
      - "Use personals for [Killing Spree] and add-heavy overlaps."
    pullWarnings:
      - "Priority interrupts now follow the documents' table: [Fel Missiles], [Seduction], [Felfire Burst], [Fel Rage], [Health Funnel], then [Chaos Bolt]."
      - "Bribed Captain — [Deep Corruption]: kill first; it buffs nearby enemies. Bribed Guard's cast priority still needs live verification."
      - "Warehouse Worker — [Sharp Nail]: random-target bleed. Warehouse Worker — [Workplace Accident]: dodge the ground danger; workers no longer flee at 30%."
  tip:
    - "Tank: Position, mitigation and pace — face trash and bosses away, plan mitigation for [Chaos Barrage]/[Envenom]/[Legion Strike] without overlapping every cooldown, and avoid combining Corrupted Warlock and Defiled Golem danger without a planned stop."
    - "Healer: Dispels and cooldowns — prioritise [Heartstop Poison] and [Corroding Spittle] when removable, plan around [Curse of Doom], and cover Kystia's 15-sec [Destabilized] pulse and Xathuux's [Demonic Rage]."
    - "DPS: Interrupts and burst — assign both Mirror Image — [Felstorm] casts, stop [Curse of Doom] and [Chaos Bolt], and save damage for [Destabilized] and Lithiel's empowered demons."
    - "Live-verified for Midnight Season 2, Patch 12.1, Standard 1.7, reviewed 12 September 2026 against Blizzard hotfixes and Season 2 overview, Wowhead, Method and Icy Veins; biggest change is Lithiel Cinderfury's Fingers of the Legion renamed to [Fingers of Gul'dan] (prefers non-tanks, targets 4 players, summons 4 Wild Imps)."
    - "Requires live verification: confirm current in-game tooltip wording where guide sources use different labels for Kystia's burst phase."
    - "Requires live verification: [Burning Steps] duration (120 seconds on PTR)."
    - "Timer: 34 minutes; interrogate four Row Snitches before Kystia."
    - "Trade Faceted Crystalline Fel to vendors for single-use dungeon items."
    - "After Kystia, take the disguise and complete the cantina jobs quickly."
    - "Five Star Review grants 10% damage and healing for 5 minutes."
    - "Current Enemy Forces requirement: 655."
    - "Tank: Plan Zaen cover and Xathuux movement space before each fight."
    - "Healer: Keep movement tools available so mechanics do not stop healing."
    - "DPS: Mechanic execution is worth more than boss uptime."

