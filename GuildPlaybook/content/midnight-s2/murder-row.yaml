# Guild Playbook content — Murder Row (Midnight Season 2)
# Source: guild DOCX playbooks "Murder Row - {Tank,Healer,DPS} Playbook and
#         Cheat Sheet" (v1.0, Patch 12.1 PTR, reviewed and verified 9 August
#         2026). Status: pre-launch verified for Midnight Season 2, Patch
#         12.1 PTR — Patch 12.1 launches 11 August, Mythic+ Season 2 opens
#         18 August 2026.
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping: the documents' page 2/3 "DUNGEON ORDER" trash sections
# (OPENING → KYSTIA, KYSTIA → ZAEN, ZAEN → XATHUUX, XATHUUX → LITHIEL) map
# 1:1 onto trashSegments. Unlike the boss sections, the v1.0 documents give
# identical trash-call wording across all three role playbooks — the Tank/
# Healer/DPS text for every named trash pack is verbatim the same — so
# trashSegments roles carry that shared wording for TANK/HEALER/DPS rather
# than an invented role split. quicksheet.trash keeps the smaller "priority
# calls" subset from the page-1 RUN-WIDE PRIORITIES kick/kill list, lightly
# flavoured per role using that same page's FOCUS bullets (which *are*
# role-specific in the source).
#
# No quicksheet.trash.ROUTE: the documents head their trash pages "OPENING
# → KYSTIA", "KYSTIA → ZAEN" etc., which give boss order, not a stated
# route — no line in either document says "route" or lists waypoints beyond
# boss names. Synthesising one from those headings was tried and reverted;
# the same ordering is already expressed structurally by trashSegments[].after.
#
# trashSegments[].npcs carries the mob names the documents call out
# (Bribed Captain, Bribed Guard, Warehouse Worker, Felmaster Lucsei,
# Corrupted Warlock, Defiled Golem). IDs are sourced from Mythic Dungeon
# Tools' published dungeon data (all NPCs in this dungeon have matches).
#
# Corrected against the 0.9 draft this file was previously transcribed from:
# - Destabilized (Kystia Manaheart) is 15 sec, not 20 — the documents' own
#   CHANGE note calls this out explicitly. Fixed in overview.healer.pressure
#   and the boss healer role.
# - Kystia's tank job was reversed in the draft: the tank holds Kystia
#   steady while the *group* drains Nibbles to 20%; the tank does not push
#   Nibbles down. Fixed.
# - Lithiel's roles.*.avoid lists all carried "Use the gateway." as
#   something to avoid. The documents are explicit that using the gateway
#   is required (Malefic Wave), so this was moved into each role's job list.
#
# Still without a home in the schema: the page-1 FOCUS bullets are role-
# specific dungeon-wide guidance not tied to one boss or trash pack — folded
# into overview.tip per role rather than modelled as fields. The 34:00 PTR
# timer, the source/version-history list and the "Cantina — Five Star
# Review" event objective also have no field; noted here instead.

dungeon: "Murder Row"
slug: murder-row
