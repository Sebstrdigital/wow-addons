# Guild Playbook content — Ruby Life Pools (Midnight Season 2)
# Source: guild DOCX playbooks "Ruby Life Pools - {Tank,Healer,Ranged DPS}
#         Playbook and Cheat Sheet" (v0.8, live Patch 12.1, verified 12
#         September 2026, next review 22 September 2026). The DPS role file is
#         now Ranged-only — no melee guidance was found in it. The docs' own
#         footer says v0.8 was "reconstructed... because the prior 0.7 role
#         files were not present in the workspace at review time," so treat
#         anything the v0.6 baseline had that v0.8 omits as possibly-real but
#         unconfirmed, not a confirmed removal (see REMOVED-only notes below).
# Edit this file, then run tools/generate.py to regenerate the Lua data.
#
# Content mapping: the documents' named trash sections now map 1:1 onto
# trashSegments, so the per-pack calls that previously had no home (Ruby Overlook
# and Final Approach) are transcribed in full. Final Approach's placeholder was
# replaced 12 Sep 2026 with its four named NPCs (Storm Warrior, Ruinous
# Stormbringer, High Channeler Ryvati, Primal Thundercloud). quicksheet.trash
# still carries the cheat-sheet's three PRIORITY TRASH CALLS — the at-a-glance
# subset, not the same content.
#
# v0.8 changes applied: Primal Juggernaut's tank/healer/DPS lines now also
# name [Excavating Blast] (a heavy frontal) alongside the existing
# [Crushing Smash] — the new doc doesn't mention Crushing Smash, so it's kept,
# not replaced. Blazebound Destroyer's tank/healer lines now also name
# [Fiery Blast] (a kickable single-target hit) alongside the existing
# [Inferno]/[Living Bomb], for the same reason. Primalist Flamedancer is renamed to Ashseer
# Flamelasher, reframed from a hard-stop-then-death-effect to a buff
# ([Blaze of Glory]) to purge/dispel/spellsteal — old avoid wording ("leave it
# on death") kept alongside the new framing per officer instruction, now
# matched to MDT's Ashseer Flamelasher entry (npcID 190206). Defier Draghar,
# Primalist Cinderweaver and Flamegullet's [Fire Maw] are absent from v0.8 but
# kept per the REMOVED-only rule — the docs never say they were cut. Erkhart
# Stormvein's kit ([Stormslam], [Interrupting Cloudburst], [Winds of Change])
# is modelled for the first time.
#
# trashSegments[].npcs carries the mob names the documents call out, so the
# sidecar can show a model once IDs exist. IDs are sourced from Mythic Dungeon
# Tools' published dungeon data. "Flashfrost Earthshaper" was a name
# conflation — the real mob is Deepstone Earthshaper (npcID 187969), now
# matched. Final Approach's four NPCs are matched the same way (Storm Warrior
# 197982, Ruinous Stormbringer 195119, High Channeler Ryvati 197535, Primal
# Thundercloud 197509).
#
# Still without a home in the schema: the release dates, the "Sources
# cross-checked" line, and the version-history entry. The 28-minute live timer
# and enemy-forces caveats are folded into overview.tip rather than modelled
# as fields.

